<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Railroom browser verification</title>
  <h1>Browser verification</h1>
  <button id="run">Run browser checks</button>
  <pre id="results">Ready</pre>
  <iframe
    id="fixture"
    title="Application under test"
    style="width: 1200px; height: 900px; border: 0"
  ></iframe>
  <script type="module">
    const results = [],
      frame = document.getElementById('fixture'),
      output = document.getElementById('results');
    const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    function assert(condition, message) {
      if (!condition) throw Error(message);
      results.push('PASS ' + message);
      output.textContent = results.join('\n');
    }
    async function until(check, message, timeout = 15000) {
      const end = performance.now() + timeout;
      while (!check()) {
        if (performance.now() > end) throw Error('Timed out: ' + message);
        await delay(25);
      }
    }
    async function navigate(url) {
      const loaded = new Promise((resolve) => (frame.onload = resolve));
      frame.removeAttribute('srcdoc');
      frame.src = url;
      await loaded;
    }
    async function run() {
      document.getElementById('run').disabled = true;
      output.textContent = 'Running…';
      let passed = false;
      try {
        await navigate('./audio-harness.html');
        await until(() => frame.contentDocument.body.dataset.result, 'offline audio render', 60000);
        results.push(frame.contentDocument.getElementById('results').textContent);
        assert(
          frame.contentDocument.body.dataset.result === 'pass',
          'complete offline audio harness',
        );
        // A superseded initial fetch must not hold the renderer hostage.
        const page = await (await fetch('../index.html')).text();
        const intercept = '<script>const realFetch = window.fetch.bind(window); window.fetch = (...args) => String(args[0]).includes("public/route.json") ? new Promise(resolve => { window.releaseInitial = () => resolve(realFetch(...args)); }) : realFetch(...args);<' + '/script>';
        frame.srcdoc = page.replace('<head>', '<head><base href="../">' + intercept);
        await until(() => frame.contentWindow.releaseInitial, 'pending initial fetch');
        const initialDoc = frame.contentDocument;
        initialDoc.getElementById('route-mode').value = 'demo';
        initialDoc.getElementById('route-mode').dispatchEvent(new frame.contentWindow.Event('change'));
        await until(() => initialDoc.getElementById('route-head')?.style.left === '0%', 'rendering after superseded initial load', 2000);
        assert(!initialDoc.getElementById('play').disabled, 'demo renders while obsolete initial fetch is pending');
        frame.contentWindow.releaseInitial();
        await navigate('../index.html');
        const win = frame.contentWindow,
          doc = frame.contentDocument,
          $ = (id) => doc.getElementById(id),
          errors = [];
        win.addEventListener('error', (e) => errors.push(e.message));
        win.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));
        const change = (id, value, event = 'input') => {
          $(id).value = String(value);
          $(id).dispatchEvent(new win.Event(event, { bubbles: true }));
        };
        await until(() => !$('play').disabled, 'route loading');
        assert($('route-mode').value === 'route', 'Kyiv–Fastiv is the default route');
        assert($('route-title').textContent === 'Kyiv → Fastiv', 'default heading matches Kyiv–Fastiv');
        change('route-mode', 'kyiv-lisbon', 'change');
        await until(() => !$('play').disabled, 'select Kyiv–Lisbon');
        assert($('route-title').textContent === 'Kyiv → Lisbon', 'new route heading');
        assert($('station').options.length === 21, 'all approved stations are available');
        const speedMarkers = [...doc.querySelectorAll('.map-speed')];
        const routeAsset = await (await win.fetch('./public/kyiv-lisbon.json')).json();
        const paris = routeAsset.stations.find(station => station.name === 'Paris');
        assert($('route-caption').textContent.includes('4,447 km') && $('route-caption').textContent.includes('approximate'), 'simplified distance and assumptions are visible');
        assert(!$('route-assumptions').hidden, 'Lisbon exposes simplified scenario attribution');
        assert(speedMarkers.length === routeAsset.operatingMarkers.length, 'long route overview shows every speed limit');
        assert(['25', '40', '50', '60', '120', '160', '200', '220', '260'].every(speed => speedMarkers.some(marker => marker.querySelector('.map-glyph').textContent === speed)), 'map shows varied restrictions and 260 km/h running limits');
        assert(doc.querySelector('.scale-labels').textContent === '0130260', 'speedometer reflects the 260 km/h maximum');
        assert($('route-map').dataset.windowStart === '0' && $('route-map').dataset.windowEnd === '1000000', 'map starts with the first 1000 km');
        const zones = [...doc.querySelectorAll('.map-track-zone')];
        assert(zones.length === routeAsset.sections.length, 'compact track sections have map bands');
        const works = routeAsset.sections.filter(section => section.purpose === 'rail-replacement');
        assert(works.length === 6 && works.every(section => section.length <= 2000), 'short rails are limited to six small replacement work sites');
        assert(zones.some(zone => zone.getAttribute('aria-label').includes('Rail replacement works')), 'work sites are labelled on the map');
        const visibleSpeedRects = [...doc.querySelectorAll('.map-speed:not([hidden])')].map(marker => marker.getBoundingClientRect());
        assert(visibleSpeedRects.every((a, i) => visibleSpeedRects.slice(i + 1).every(b =>
          a.right <= b.left || b.right <= a.left || a.bottom <= b.top || b.bottom <= a.top)), 'all nearby speed badges remain readable');
        assert(zones.some(zone => !zone.hidden && zone.getAttribute('aria-label').includes('25 m rails + 12.5 m inserts')), 'short work-site rail groups are visible in the starting window');
        assert(zones.some(zone => !zone.hidden && zone.getAttribute('aria-label').includes('800 m rails')), '800 m rail areas are visible in the starting window');
        assert(zones.some(zone => !zone.hidden && zone.getAttribute('aria-label').includes('1,500 m rails')), '1500 m rail areas are visible in the starting window');
        assert([...doc.querySelectorAll('.map-station:not([hidden])')].length === routeAsset.stations.filter(station => station.position <= 1000000).length, 'stations beyond the visible window are hidden');
        change('station', paris.position, 'change');
        $('seek').click();
        await until(() => $('route-map').dataset.windowStart === String(paris.position - 500000), 'map follows jump to Paris');
        assert($('route-head').style.left === '50%', 'train is centered within the route');
        const carriedLimit = doc.querySelector('.map-speed:not([hidden])');
        const edgeLimit = routeAsset.operatingMarkers.find(marker => marker.position <= (paris.position - 500000) && marker.endPosition > (paris.position - 500000));
        assert(carriedLimit.style.left === '0%' && carriedLimit.querySelector('.map-glyph').textContent === String(edgeLimit.speedKmh), 'active limit carries into the left edge');
        const edgeZone = doc.querySelector('.map-track-zone:not([hidden])');
        assert(edgeZone.style.left === '0%' && parseFloat(edgeZone.style.width) > 0, 'zone crossing the viewport edge is clipped to the visible window');
        change('station', routeAsset.length, 'change');
        $('seek').click();
        await until(() => $('distance').textContent.startsWith((routeAsset.length / 1000).toFixed(3)), 'jump to Lisbon');
        assert($('route-map').dataset.windowEnd === String(routeAsset.length) && $('route-head').style.left === '100%', 'map clamps at the terminus');
        const originalFetch = win.fetch.bind(win);
        win.fetch = async () => { throw new Error('Simulated route failure'); };
        change('route-mode', 'route', 'change');
        await until(() => !$('error').hidden, 'route load failure');
        assert($('play').disabled, 'failed route cannot start playback');
        win.fetch = originalFetch;
        // A late successful fetch must not replace a newer selection.
        let release;
        win.fetch = async (...args) => {
          const response = await originalFetch(...args);
          await new Promise(resolve => { release = resolve; });
          return response;
        };
        change('route-mode', 'route', 'change');
        await until(() => release, 'delayed route response');
        change('route-mode', 'demo', 'change');
        await until(() => !$('play').disabled, 'demo supersedes pending fetch');
        release();
        await delay(100);
        assert($('route-title').textContent.includes('25 m'), 'stale response does not replace demo');
        win.fetch = originalFetch;
        change('route-mode', 'route', 'change');
        await until(() => !$('play').disabled, 'recover to Kyiv–Fastiv');
        assert($('error').hidden && $('route-title').textContent === 'Kyiv → Fastiv', 'route loading recovers');
        assert($('cars').value === '10', 'Cairo defaults to ten carriages');
        assert($('seat-label').textContent.includes('5 of 10'), 'listener starts in carriage five');
        assert(
          [...doc.querySelectorAll('[data-seat]')].map((b) => b.dataset.seat).join(',') ===
            '2,9.7,17.4',
          'seat presets follow Cairo axle geometry',
        );
        change('master', 0);
        // Pre-audio navigation must survive first graph construction.
        change('station', 23000, 'change');
        $('seek').click();
        await until(() => $('distance').textContent.startsWith('23.000'), 'pre-audio seek');
        $('reset').click();
        await until(() => $('distance').textContent.startsWith('0.000'), 'pre-audio reset');
        $('play').click();
        await until(() => Number($('speed').textContent) >= 1, 'journey acceleration');
        assert(
          $('play-label').textContent === 'Pause journey',
          'start initializes audio and advances motion',
        );
        $('play').click();
        await until(() => $('play-label').textContent === 'Resume journey', 'pause');
        const pausedDistance = $('distance').textContent;
        await delay(250);
        assert($('distance').textContent === pausedDistance, 'pause freezes position');
        $('reset').click();
        await until(
          () =>
            $('distance').textContent.startsWith('0.000') && Number($('speed').textContent) === 0,
          'reset',
        );
        assert(Number($('speed').textContent) === 0, 'reset stops and rewinds');
        change('station', 23000, 'change');
        $('seek').click();
        await until(() => $('distance').textContent.startsWith('23.000'), 'station seek');
        assert(Number($('speed').textContent) === 0, 'station seek stays stopped');
        $('autopilot').click();
        await until(() => $('autopilot').getAttribute('aria-pressed') === 'true', 'autopilot');
        assert(!$('autopilot-status').hidden, 'autopilot starts and exposes departure status');
        change('route-mode', 'kyiv-lisbon', 'change');
        await until(() => !$('play').disabled, 'switch during autopilot');
        assert($('autopilot').getAttribute('aria-pressed') === 'false', 'route switch disables autopilot');
        await until(() => Number($('speed').textContent) === 0 && $('distance').textContent.startsWith('0.000'), 'route switch pauses and resets');
        change('route-mode', 'route', 'change');
        await until(() => !$('play').disabled, 'return to original route');
        change('station', 23000, 'change');
        $('seek').click();
        $('autopilot').click();
        await until(() => $('autopilot').getAttribute('aria-pressed') === 'true', 'restart autopilot');
        change('throttle', 35);
        await until(
          () => $('autopilot').getAttribute('aria-pressed') === 'false',
          'manual takeover',
        );
        assert(
          $('throttle-value').textContent === '35%',
          'manual takeover preserves the requested throttle',
        );
        change('motor-mode', 'recorded', 'change');
        assert(
          $('sound-note').textContent.includes('Recorded'),
          'motor mode changes during playback',
        );
        change('cars', 1, 'change');
        await until(
          () =>
            $('seat-label').textContent.includes('1 of 1') &&
            $('play-label').textContent === 'Resume journey',
          'consist rebuild',
        );
        assert(
          $('play-label').textContent === 'Resume journey',
          'consist changes pause the journey',
        );
        $('audition').click();
        await until(() => Number($('speed').textContent) >= 71, 'demo audition');
        assert($('route-mode').value === 'demo', 'audition switches to the jointed fixture');
        change('route-mode', 'demo-12.5', 'change');
        await until(() => Number($('speed').textContent) === 0, 'short-rail route reset');
        assert(
          $('route-caption').textContent.startsWith('12.5 m'),
          'short-rail demo is selectable',
        );
        $('audition').click();
        await until(() => Number($('speed').textContent) >= 71, 'short-rail audition');
        assert(
          $('route-mode').value === 'demo-12.5',
          'audition preserves the selected 12.5 m demo',
        );
        $('reset').click();
        await until(() => Number($('speed').textContent) === 0, 'final reset');
        change('route-mode', 'kyiv-lisbon', 'change');
        await until(() => !$('play').disabled, 'load long route for moving viewport');
        change('station', paris.position, 'change');
        $('seek').click();
        change('throttle', 35);
        $('play').click();
        await until(() => Number($('route-map').dataset.windowStart) > (paris.position - 500000), 'map scrolls during playback');
        assert($('route-head').style.left === '50%', 'moving train stays centered');
        $('play').click();
        await until(() => $('play-label').textContent === 'Resume journey', 'pause scrolling');
        const pausedWindow = $('route-map').dataset.windowStart;
        await delay(150);
        assert($('route-map').dataset.windowStart === pausedWindow, 'paused viewport stays still');
        assert($('error').hidden && errors.length === 0, 'control lifecycle has no browser errors');
        passed = true;
      } catch (error) {
        results.push('FAIL ' + error.stack);
      }
      frame.src = 'about:blank';
      document.body.dataset.result = passed ? 'pass' : 'fail';
      output.textContent = results.join('\n');
      const report = new URLSearchParams(location.search).get('report');
      if (report)
        await fetch(`/__results/${report}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passed, results }),
        });
    }
    document.getElementById('run').onclick = run;
    if (new URLSearchParams(location.search).has('report')) run();
  </script>
</html>
