<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Railroom audio verification</title>
  </head>
  <body>
    <h1>Audio verification</h1>
    <pre id="results">Running…</pre>
    <script type="module">
      import { SampleBank } from '../src/audio/sample-bank.js';
      import {
        SpatialMixer,
        MAX_IMPACT_VOICES,
      } from '../src/audio/spatial-mixer.js?v=voice-priority';
      import {
        wheelsets,
        RouteIndex,
        demoRoute,
      } from '../src/route/route-index.js?v=impact-reverb500';
      import { Transport } from '../src/audio/scheduler.js?v=horn';
      import { RecordedMotor } from '../src/audio/recorded-motor.js';
      import { TractionMotor } from '../src/audio/traction.js?v=impact-reverb500';
      import { RollingLayers } from '../src/audio/rolling.js?v=review-fixes';
      import { AudioEngine } from '../src/audio/engine.js?v=review-fixes';
      import { CabinAmbience } from '../src/audio/ambient.js';
      import { PneumaticAudio } from '../src/audio/pneumatic.js';
      const results = [];
      const assert = (condition, message) => {
        if (!condition) throw Error(message);
        results.push('PASS ' + message);
      };
      try {
        const airContext = new OfflineAudioContext(2, 48000, 48000);
        const airMixer = {
          master: airContext.destination,
          levels: { brake: 1 },
          axles: [{ id: 'test', car: 1 }],
          occupied: 1,
          emitters: new Map([['test:center', { gain: airContext.destination }]]),
        };
        const airSound = new PneumaticAudio(airContext, airMixer);
        airSound.start();
        airSound.update({ air: { releaseFlow: 3, compressor: true } }, {}, true);
        airSound.stop(0.5);
        const airOutput = await airContext.startRendering(),
          airData = airOutput.getChannelData(0);
        assert(
          airData.some((v) => Math.abs(v) > 0.001),
          'pneumatic exhaust and compressor are audible at rest',
        );
        assert(
          airData.every((v) => Number.isFinite(v) && Math.abs(v) < 1),
          'pneumatic sound has finite output and headroom',
        );
        assert(
          airData.slice(30000).every((v) => v === 0),
          'pneumatic sounds fade out on pause',
        );
        const ambientContext = new OfflineAudioContext(2, 32000, 32000),
          ambientMixer = {
            master: ambientContext.destination,
            levels: { ambient: 0.5 },
          };
        const ambient = new CabinAmbience(ambientContext, ambientMixer);
        ambient.start();
        ambient.update({ speed: 0 }, {}, true);
        ambient.stop(0.7);
        const cabin = await ambientContext.startRendering();
        let cabinEnergy = 0,
          cabinPeak = 0;
        for (const v of cabin.getChannelData(0)) {
          assertFinite(v);
          cabinEnergy += v * v;
          cabinPeak = Math.max(cabinPeak, Math.abs(v));
        }
        assert(
          cabinEnergy > 0.001 && cabinPeak < 0.03,
          'carriage ambience is audible and quiet at rest',
        );
        assert(
          cabin
            .getChannelData(0)
            .slice(25000)
            .every((v) => v === 0),
          'carriage ambience fades to silence on pause',
        );
        const rate = 48000,
          context = new OfflineAudioContext(2, rate * 3, rate);
        const bank = await new SampleBank(context).load('../public/audio/manifest.json');
        assert(bank.samples.length === 12, 'all twelve recording assets decode');
        assert(
          bank.samples.every((s) => s.buffer.numberOfChannels === 1),
          'point-source recordings are mono',
        );
        const mixer = new SpatialMixer(context, bank, wheelsets(10));
        assert(
          mixer.master.gain.value === 1 && Math.abs(mixer.mixBoost.gain.value - 1.4) < 1e-6,
          'master defaults to 100% with 1.4x mix boost',
        );
        mixer.setListener(108.7, 0);
        assert(
          mixer.locomotive.paths.length === 4,
          'locomotive has one direct path and three carriage reflections',
        );
        assert(
          mixer.locomotive.paths[0].pan.positionZ.value === -14,
          'locomotive source stays ahead of the train',
        );
        const engine = new AudioEngine(context, bank, mixer);
        engine.start();
        assert(
          mixer.audibleAxles.length === 20,
          'continuous carriage layers retain the five-carriage isolation range',
        );
        assert(
          engine.rolling.layers.filter((l) => l.kind === 'rolling').length === 8,
          'only the occupied carriage creates eight rolling wheel sources',
        );
        assert(engine.motor.voices.length === 10, 'only five carriages create motor sources');
        assert(
          mixer.transmission('c4-a1') === 0.3 &&
            mixer.transmission('c3-a1') === 0.05 &&
            mixer.transmission('c2-a1') === 0,
          'interior isolation gains follow carriage distance',
        );
        engine.update({ speed: 20 }, { throttle: 0.5, brake: 0.2 }, true);
        for (let repeat = 0; repeat < 1; repeat++)
          for (const axle of wheelsets(10))
            for (const side of ['left', 'right'])
              mixer.hit(
                {
                  kind: 'joint',
                  wheelsetId: axle.id,
                  side,
                  offset: axle.offset,
                  position: repeat * 25,
                  objectId: `${repeat}-${side}`,
                  speedMps: 33.3,
                },
                0.2 + repeat * 0.3 + (axle.offset % 24.75) / 200,
                0,
              );
        assert(
          engine.rolling.layers
            .filter((l) => l.kind === 'rolling')
            .every((l) => Object.keys(l.bands).length === 2),
          'each wheel has independently controlled low and high rolling bands',
        );
        assert(mixer.voices.size === 80, 'all carriage wheels create distance-attenuated impacts');
        mixer.power({ kind: 'power_off' }, 0.8, 0);
        mixer.power({ kind: 'power_on' }, 1.2, 0);
        assert(mixer.voices.size === 82, 'power switch sounds are scheduled and tracked');
        assert(mixer.voices.size <= 512, 'ten-carriage voice budget is bounded');
        const output = await context.startRendering();
        let peak = 0,
          energy = 0,
          difference = 0;
        for (let i = 0; i < output.length; i++) {
          let l = output.getChannelData(0)[i],
            r = output.getChannelData(1)[i];
          if (!Number.isFinite(l) || !Number.isFinite(r)) throw Error('Non-finite audio');
          peak = Math.max(peak, Math.abs(l), Math.abs(r));
          energy += l * l + r * r;
          difference += Math.abs(l - r);
        }
        assert(energy > 1, 'real samples produce non-silent audio');
        assert(peak < 1, 'ten-carriage mixed render has no sample clipping');
        assert(difference > 1, 'spatial output contains distinct left and right channels');
        results.push(`Peak ${peak.toFixed(5)}; output ${output.duration} s`);
        // Transport's real event times drive a test-only impulse renderer, before spatial effects.
        const timing = new OfflineAudioContext(1, rate * 1.5, rate),
          impulse = timing.createBuffer(1, 1, rate);
        impulse.getChannelData(0)[0] = 0.5;
        let clock = 0;
        const sink = {
          hit(e, when) {
            if (e.side !== 'left') return;
            const s = timing.createBufferSource();
            s.buffer = impulse;
            s.connect(timing.destination);
            s.start(when);
          },
          cancelFrom() {},
          silence() {},
        };
        const transport = new Transport({
          clock: () => clock,
          sink,
          route: new RouteIndex(demoRoute(1000)),
          axles: wheelsets(1),
          vehicle: { maxSpeed: 100, resistance: 0, drag: 0, jerk: Infinity },
        });
        transport.state.speed = 25;
        transport.start();
        for (let i = 1; i <= 55; i++) {
          clock = i * 0.025;
          transport.tick();
        }
        const timed = await timing.startRendering(),
          data = timed.getChannelData(0);
        for (const expected of [1.06, 1.156]) {
          const index = Math.round(expected * rate);
          assert(
            Math.abs(data[index] - 0.5) < 1e-6,
            `axle event at ${expected}s is frame accurate`,
          );
        }
        assert(mixer.voices.size === 0, 'finished impact sources are reclaimed');
        const fadeContext = new OfflineAudioContext(1, rate * 0.2, rate),
          constant = fadeContext.createBuffer(1, rate, rate);
        constant.getChannelData(0).fill(0.2);
        const fadeMixer = {
          axles: [{ id: 'test', car: 1, offset: 0 }],
          occupied: 1,
          seat: 9.7,
          levels: { rolling: 1 },
          emitters: new Map(
            ['left', 'right', 'center'].map((side) => [
              'test:' + side,
              { gain: fadeContext.destination },
            ]),
          ),
        };
        const fadeBank = {
          pool: (kind) => (kind === 'rolling' ? [{ buffer: constant, gain: 1 }] : []),
        };
        const fadeLayer = new RollingLayers(fadeContext, fadeBank, fadeMixer);
        fadeLayer.start();
        fadeLayer.update({ speed: 20 }, {}, true);
        fadeLayer.stop(0.1);
        const faded = (await fadeContext.startRendering()).getChannelData(0);
        results.push(
          'Fade samples ' +
            [0.05, 0.095, 0.105, 0.11, 0.15].map((t) => faded[Math.round(t * rate)]).join(', '),
        );
        assert(
          faded[Math.round(0.11 * rate)] > 0,
          'continuous audio remains connected during its fade',
        );
        assert(
          Math.abs(faded[Math.round(0.15 * rate)]) < 1e-8,
          'continuous audio is silent after scheduled stop',
        );
        assert(
          Math.abs(faded[Math.round(0.1 * rate)] - faded[Math.round(0.1 * rate) - 1]) < 0.0001,
          'pause fade starts without an abrupt waveform cut',
        );
        const motorContext = new OfflineAudioContext(1, rate * 0.5, rate);
        const motorMixer = {
          axles: wheelsets(3),
          levels: { traction: 1 },
          emitters: new Map(
            wheelsets(3).map((a) => [a.id + ':center', { gain: motorContext.destination }]),
          ),
        };
        const motor = new TractionMotor(motorContext, motorMixer);
        motor.start();
        motor.update({ speed: 25 }, { throttle: 1 }, true);
        assert(
          motor.voices.length === 6,
          'three carriages use six independent continuous motor voices',
        );
        motor.stop(0.3);
        const motorAudio = (await motorContext.startRendering()).getChannelData(0);
        let motorPeak = 0,
          motorEnergy = 0;
        for (const v of motorAudio) {
          if (!Number.isFinite(v)) throw Error('Non-finite motor output');
          motorPeak = Math.max(motorPeak, Math.abs(v));
          motorEnergy += v * v;
        }
        assert(
          motorEnergy > 0.1 && motorPeak < 0.5,
          'synthesized traction is audible and has mix headroom',
        );
        assert(
          Math.abs(motorAudio[Math.round(0.4 * rate)]) < 1e-8,
          'synthesized traction stops cleanly',
        );
        results.push('Motor peak ' + motorPeak.toFixed(5));
        const recordContext = new OfflineAudioContext(1, rate * 0.5, rate);
        const recordBank = await new SampleBank(recordContext).load(
          '../public/audio/manifest.json',
        );
        const recordMixer = {
          axles: wheelsets(3),
          levels: { traction: 1 },
          emitters: new Map(
            wheelsets(3).map((a) => [a.id + ':center', { gain: recordContext.destination }]),
          ),
        };
        const recorded = new RecordedMotor(recordContext, recordBank, recordMixer);
        recorded.start();
        recorded.update({ speed: 20 }, { throttle: 1 }, true);
        const recordVoices = [...recorded.voices];
        assert(recordVoices.length === 6, 'recorded motor has six spatial voice feeds');
        assert(
          recordVoices.every((v) => v.sources.size <= 4),
          'recorded grains have a bounded lookahead queue',
        );
        recorded.stop(0.25);
        const recordAudio = (await recordContext.startRendering()).getChannelData(0);
        let recordPeak = 0,
          recordEnergy = 0;
        for (const v of recordAudio) {
          if (!Number.isFinite(v)) throw Error('Non-finite recorded motor output');
          recordPeak = Math.max(recordPeak, Math.abs(v));
          recordEnergy += v * v;
        }
        assert(
          recordEnergy > 0.01 && recordPeak < 0.5,
          'recorded texture renders audible audio with headroom',
        );
        assert(
          Math.abs(recordAudio[Math.round(0.4 * rate)]) < 1e-8,
          'recorded texture fades to silence on stop',
        );
        assert(
          recordVoices.every((v) => v.sources.size === 0),
          'recorded grain sources are reclaimed',
        );
        results.push('Recorded texture peak ' + recordPeak.toFixed(5));

        const { splitRolling } = await import('../src/audio/rolling-bands.js');
        const splitContext = new OfflineAudioContext(1, 128, rate),
          splitSource = splitContext.createBufferSource();
        const split = splitRolling(splitContext, splitSource, splitContext.destination);
        const frequencies = new Float32Array([50, 250, 500, 1000, 5000]);
        const responses = [];
        for (const band of Object.values(split)) {
          const mag = new Float32Array(5),
            phase = new Float32Array(5);
          band.filters[0].getFrequencyResponse(frequencies, mag, phase);
          responses.push({ mag, phase });
        }
        for (let i = 0; i < 5; i++) {
          let real = 0,
            imag = 0;
          for (const r of responses) {
            real += r.mag[i] ** 2 * Math.cos(2 * r.phase[i]);
            imag += r.mag[i] ** 2 * Math.sin(2 * r.phase[i]);
          }
          assert(
            Math.abs(Math.hypot(real, imag) - 1) < 0.001,
            `rolling bands sum flat at ${frequencies[i]} Hz`,
          );
        }
        assert(
          responses[0].mag[4] ** 2 < 0.001 && responses[1].mag[0] ** 2 < 0.001,
          'low and high bands reject the opposite frequency range',
        );
        const brakeContext = new OfflineAudioContext(1, rate * 0.8, rate),
          brakeBank = await new SampleBank(brakeContext).load('../public/audio/manifest.json');
        const brakeMixer = {
          occupied: 5,
          axles: wheelsets(10),
          levels: { brake: 1 },
          emitters: new Map(
            wheelsets(10).map((a) => [a.id + ':center', { gain: brakeContext.destination }]),
          ),
        };
        const { BrakingLayers } = await import('../src/audio/braking.js');
        const brakes = new BrakingLayers(brakeContext, brakeBank, brakeMixer);
        brakes.start();
        brakes.update({ speed: 20 }, { brake: 0 }, true);
        assert(
          [...brakes.tone.voices, ...brakes.hiss.voices].every((v) => v.sources.size === 0),
          'released brakes schedule no silent grains',
        );
        brakes.update({ speed: 20 }, { brake: 0.8 }, true);
        const brakeVoices = [...brakes.tone.voices, ...brakes.hiss.voices];
        assert(
          brakes.tone.voices.length === 2 && brakes.hiss.voices.length === 2,
          'separate brake tone and hiss at two local bogies',
        );
        assert(
          brakeVoices.every((v) => v.sources.size > 0 && v.sources.size <= 4),
          'brake grains are audible candidates with bounded queues',
        );
        assert(
          brakes.hiss.voices.every((v) => v.rate === 1),
          'hiss is not pitch shifted',
        );
        brakes.stop(0.45);
        const brakeAudio = (await brakeContext.startRendering()).getChannelData(0);
        let brakePeak = 0,
          brakeEnergy = 0;
        for (const v of brakeAudio) {
          assertFinite(v);
          brakePeak = Math.max(brakePeak, Math.abs(v));
          brakeEnergy += v * v;
        }
        assert(
          brakeEnergy > 0.01 && brakePeak < 1,
          'split braking renders audible finite audio with headroom',
        );
        assert(Math.abs(brakeAudio[Math.round(0.6 * rate)]) < 1e-8, 'brake layers stop cleanly');
        assert(
          brakeVoices.every((v) => v.sources.size === 0),
          'brake grains are reclaimed',
        );
        results.push('Brake peak ' + brakePeak.toFixed(5));

        // Advance the actual scheduler as native offline sources finish. A single
        // up-front burst cannot exercise the sustained voice lifetime/budget problem.
        const loadContext = new OfflineAudioContext(2, rate * 6, rate);
        const loadAxles = wheelsets(10),
          loadMixer = new SpatialMixer(loadContext, bank, loadAxles);
        loadMixer.setListener(108.7, 0);
        let loadAttempts = 0,
          loadDrops = 0,
          localDrops = 0,
          maximumVoices = 0;
        // Short rails are the densest route section: twice the 25 m contact rate.
        const shortRailRoute = demoRoute();
        shortRailRoute.events = shortRailRoute.events.map((event) => ({
          ...event, position: event.position / 2,
        }));
        const loadTransport = new Transport({
          clock: () => loadContext.currentTime,
          route: new RouteIndex(shortRailRoute),
          axles: loadAxles,
          vehicle: { maxSpeed: 100, resistance: 0, drag: 0, jerk: Infinity },
          sink: {
            hit(event, when, generation) {
              loadAttempts++;
              loadMixer.hit(event, when, generation);
              if (loadMixer.lastImpacts.get(`${event.wheelsetId}:${event.side}`) !== when) {
                loadDrops++;
                if (event.wheelsetId.startsWith('c5-')) localDrops++;
              }
              maximumVoices = Math.max(maximumVoices, loadMixer.voices.size);
            },
            cancelFrom: (time) => loadMixer.cancelFrom(time),
            silence: () => loadMixer.silence(),
          },
        });
        loadTransport.state.position = 1000;
        loadTransport.state.speed = 100;
        loadTransport.start();
        const updates = [];
        for (let tick = 1; tick <= 160; tick++) {
          updates.push(
            loadContext.suspend(tick * 0.025).then(() => {
              loadTransport.tick();
              return loadContext.resume();
            }),
          );
        }
        const loaded = await loadContext.startRendering();
        await Promise.all(updates);
        assert(
          loadAttempts > 2400 && loadTransport.underruns === 0,
          '360 km/h on 12.5 m rails runs on the audio clock without interruptions',
        );
        assert(
          localDrops === 0 && loadDrops === 0,
          'maximum-speed load preserves every new wheel contact',
        );
        assert(
          maximumVoices <= MAX_IMPACT_VOICES,
          'maximum-speed load stays within the impact group budget',
        );
        assert(
          loadMixer.voices.size === 0,
          'maximum-speed impacts and reclaimed metal tails are cleaned up',
        );
        let loadPeak = 0,
          loadEnergy = 0;
        for (let channel = 0; channel < loaded.numberOfChannels; channel++) {
          for (const value of loaded.getChannelData(channel)) {
            assertFinite(value);
            loadPeak = Math.max(loadPeak, Math.abs(value));
            loadEnergy += value * value;
          }
        }
        assert(
          loadEnergy > 1 && loadPeak < 1,
          'maximum-speed audio remains audible with mix headroom',
        );
        results.push(
          `Maximum load ${loadAttempts} contacts, ${loadDrops} drops, peak ${loadPeak.toFixed(5)}, ${maximumVoices} groups`,
        );
        function assertFinite(v) {
          if (!Number.isFinite(v)) throw Error('Non-finite brake audio');
        }
        document.body.dataset.result = 'pass';
      } catch (e) {
        results.push('FAIL ' + e.stack);
        document.body.dataset.result = 'fail';
      }
      document.getElementById('results').textContent = results.join('\n');
    </script>
  </body>
</html>
